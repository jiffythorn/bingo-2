name: Tests and download ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Rebuild download ZIP
        run: python3 scripts/build-zip.py

      - name: Fail if the committed ZIP is stale
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- downloads/bingo-2.zip; then
            echo "ZIP matches the sources."
          else
            echo "::error file=downloads/bingo-2.zip::downloads/bingo-2.zip is stale. Run 'python3 scripts/build-zip.py' and commit the result."
            git diff --stat -- downloads/bingo-2.zip
            exit 1
          fi

      - name: Commit the ZIP if it changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- downloads/bingo-2.zip; then
            echo "ZIP already matches the sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/bingo-2.zip
          git commit -m "Rebuild download ZIP"
          git push
